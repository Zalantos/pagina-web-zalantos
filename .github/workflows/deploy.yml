name: Deploy to cPanel (Astro static)

on:
  push:
    branches: ["main"]   # cambia a "master" si tu rama principal es master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro static -> dist/)
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/404.html
          test -f dist/blog/index.html
          test -f dist/consultor-ia/index.html
          test -f dist/og/home.png
          test -f dist/og-image.png

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTPS (dist/ -> public_html)
        env:
          HOST: ${{ secrets.CPANEL_HOST }}     # ftp.zalantos.com
          USER: ${{ secrets.CPANEL_USER }}     # deploy@zalantos.com
          PASS: ${{ secrets.CPANEL_PASS }}
          REMOTE_PATH: ${{ secrets.CPANEL_PATH }}  # ./
        run: |
          lftp -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 20;
            open -u $USER,$PASS ftp://$HOST;
            mirror -R --delete --verbose --parallel=5 --include-glob '.*' --include-glob '*' dist/ $REMOTE_PATH;
            bye
          "
